[project]
name = "car-auction-bot"
version = "0.1.0"
description = "Telegram bot game: container auction, cars, garage, VIP, Battle Pass, shop, referrals, admin panel"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: требует PostgreSQL (переменная окружения TEST_POSTGRES_URL)"]
